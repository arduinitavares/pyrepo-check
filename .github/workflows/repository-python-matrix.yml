name: repository-python-matrix

on:
  pull_request:
  push:
    branches: [main]

env:
  # uv's Linux catalog has no 3.13.15 build; 3.14.3 satisfies the project floor.
  CONTROLLER_PYTHON: "3.14.3"

jobs:
  controller-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"
          enable-cache: true
      - name: Install controller and fixture Pythons
        run: uv python install "$CONTROLLER_PYTHON" 3.13
      - name: Synchronize controller environment
        run: uv sync --locked --python "$CONTROLLER_PYTHON"
      - name: Run controller quality gate including real uv integration
        run: |
          uv run --locked --python "$CONTROLLER_PYTHON" python -m ruff check .
          uv run --locked --python "$CONTROLLER_PYTHON" python -m ruff check . --select ANN --output-format concise
          uv run --locked --python "$CONTROLLER_PYTHON" python -m ty check
          uv run --locked --python "$CONTROLLER_PYTHON" python -m bandit -c pyproject.toml -r .
          uv run --locked --python "$CONTROLLER_PYTHON" python -m coverage run --rcfile=pyproject.toml -m pytest
          uv run --locked --python "$CONTROLLER_PYTHON" python -m coverage report --rcfile=pyproject.toml

  repository-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repository-python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"
          enable-cache: true
      - name: Install controller and repository Pythons
        run: uv python install "$CONTROLLER_PYTHON" ${{ matrix.repository-python }}
      - name: Synchronize controller environment
        run: uv sync --locked --python "$CONTROLLER_PYTHON"
      - name: Verify one Repository Python
        env:
          PYREPO_CHECK_REPOSITORY_PYTHON: ${{ matrix.repository-python }}
          UV_PYTHON_DOWNLOADS: never
        run: >-
          uv run --locked --python "$CONTROLLER_PYTHON" python -m pytest
          tests/test_repository_python_matrix.py -q
