[project]
name = "pyrepo-check"
version = "0.1.0"
description = "Reusable Python repository quality-gate wrapper."
readme = "README.md"
requires-python = ">=3.13.15"
dependencies = []

[project.scripts]
pyrepo-check = "pyrepo_check.cli:main"

[dependency-groups]
dev = [
    "bandit>=1.9,<2",
    "coverage[toml]>=7.15,<8",
    "pytest>=8,<9",
    "pytest-rerunfailures>=16.6,<17",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.15,<1",
    "ty>=0.0.35,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrepo_check"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/pyrepo_check"]
parallel = false

[tool.coverage.report]
fail_under = 86.01
precision = 2

[tool.bandit]
exclude_dirs = [".venv", ".pytest_cache", ".ruff_cache"]

[tool.bandit.assert_used]
skips = ["./tests/*"]
