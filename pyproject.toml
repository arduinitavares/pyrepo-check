[project]
name = "pyrepo-check"
version = "0.1.0"
description = "Reusable Python repository quality-gate wrapper."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pyrepo-check = "pyrepo_check.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.15,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyrepo_check"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
